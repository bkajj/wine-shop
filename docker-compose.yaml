services:
  backend:
    build: ./backend
    container_name: wine-shop-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8000
        REACT_APP_FRONTEND_URL: http://localhost:3000
    container_name: wine-shop-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend